name: Build Fit21 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 初始化 Android 專案基礎架構
        run: |
          rm -rf android lib test
          flutter create --platforms=android --org com.example --project-name voice_reminder_assistant .
          rm -rf lib test

      - name: 解壓 Fit21 應用程式源碼並修復相容性
        run: |
          python3 -c "import os, zipfile; z=zipfile.ZipFile('fit21-voice-app.zip'); [(os.makedirs(os.path.dirname(p), exist_ok=True) if os.path.dirname(p) else None, open(p, 'wb').write(z.read(m)), print('Extracted:', p)) for m in z.infolist() for p in [m.filename.replace(chr(92), '/')] if not p.endswith('/') and not p.startswith('android/')]"
          python3 -c "p='lib/main.dart'; s=open(p).read().replace('cardTheme: CardTheme(', 'cardTheme: CardThemeData(').replace('void main() async {', 'void main() {').replace('await StorageService().init();', '').replace('await NotificationService().init();', '').replace('await SpeechService().init();', ''); s=s.replace('runApp(', 'ErrorWidget.builder=(details)=>MaterialApp(home:Scaffold(body:Center(child:Text(details.exceptionAsString()))));\n  runApp('); open(p,'w').write(s); print('Patched main.dart')"
          python3 -c "p='lib/services/storage_service.dart'; s=open(p).read().replace('prefs.getStringList', '_prefs?.getStringList').replace('prefs.getString', '_prefs?.getString').replace('prefs.getBool', '_prefs?.getBool').replace('prefs.getDouble', '_prefs?.getDouble'); open(p,'w').write(s); print('Patched storage_service.dart')"
          python3 -c "import re; p='lib/screens/home_screen.dart'; s=open(p).read(); s=s.replace(\"import '../services/storage_service.dart';\", \"import '../services/speech_service.dart';\nimport '../services/storage_service.dart';\"); s=s.replace('void initState() {\n    super.initState();\n    _loadData();\n  }', 'void initState() {\n    super.initState();\n    _loadData();\n    Future.microtask(() async { try { await _storage.init(); if (mounted) _loadData(); } catch(_) {} try { await _notifications.init(); } catch(_) {} try { await SpeechService().init(); } catch(_) {} });\n  }'); s=re.sub(r'final dateStr = DateFormat\(.+?\)\.format\(now\);', 'const w=[\"\",\"星期一\",\"星期二\",\"星期三\",\"星期四\",\"星期五\",\"星期六\",\"星期日\"]; final dateStr=now.month.toString()+\"月\"+now.day.toString()+\"日 \"+w[now.weekday];', s); open(p,'w').write(s); print('Patched home_screen.dart')"
          python3 -c "import re; p='lib/models/reminder_item.dart'; s=open(p).read(); s=re.sub(r'String get formattedDate\s*\{[\s\S]*?\}', 'String get formattedDate{if(isToday)return\"今天\";if(isTomorrow)return\"明天\";const w=[\"\",\"一\",\"二\",\"三\",\"四\",\"五\",\"六\",\"日\"];return reminderTime.month.toString()+\"月\"+reminderTime.day.toString()+\"日 (\"+w[reminderTime.weekday]+\")\";}', s); s=re.sub(r'String get formattedTime\s*\{[\s\S]*?\}', 'String get formattedTime{final p=reminderTime.hour<12?\"上午\":\"下午\";final h=reminderTime.hour==0?12:(reminderTime.hour>12?reminderTime.hour-12:reminderTime.hour);final m=reminderTime.minute.toString().padLeft(2,\"0\");return p+\" \"+h.toString()+\":\"+m;}', s); open(p,'w').write(s); print('Patched reminder_item.dart')"
          python3 -c "p='lib/services/notification_service.dart'; s=open(p).read().replace('await androidImpl.requestExactAlarmsPermission();', ''); open(p,'w').write(s); print('Patched notification_service.dart')"
          python3 -c "import re; p='lib/services/speech_service.dart'; s=open(p).read(); s=re.sub(r'await _tts\.setIosAudioCategory[\s\S]*?\);', '', s); s=s.replace('partialResults: true,', '').replace('cancelOnError: false,', '').replace('pauseFor: const Duration(seconds: 3)', 'pauseFor: const Duration(milliseconds: 1500)').replace('await _speech.stop();', 'try { await _speech.stop().timeout(const Duration(milliseconds: 500)); } catch (_) {}'); s=re.sub(r'listenMode:\s*stt\.ListenMode\.\w+,?', '', s); open(p,'w').write(s); print('Patched speech_service.dart')"
          python3 -c "p='lib/services/ai_service.dart'; s=open(p).read().replace('const Duration(seconds: 10)', 'const Duration(milliseconds: 2000)').replace('final now = DateTime.now();', 'final now = DateTime.now(); text = text.replaceAll(\"兩點\", \"2點\").replaceAll(\"三點\", \"3點\").replaceAll(\"四點\", \"4點\").replaceAll(\"五點\", \"5點\").replaceAll(\"六點\", \"6點\").replaceAll(\"七點\", \"7點\").replaceAll(\"八點\", \"8點\").replaceAll(\"九點\", \"9點\").replaceAll(\"十點\", \"10點\").replaceAll(\"十一點\", \"11點\").replaceAll(\"十二點\", \"12點\").replaceAll(\"一點\", \"1點\").replaceAll(\"半小時後\", \"30分鐘後\").replaceAll(\"十分鐘後\", \"10分鐘後\").replaceAll(\"兩小時後\", \"2小時後\").replaceAll(\"一小時後\", \"1小時後\");'); open(p,'w').write(s); print('Patched ai_service.dart')"
          python3 -c "import re; p='lib/widgets/voice_assistant_sheet.dart'; s=open(p).read(); s=re.sub(r'onSoundLevel:\s*\(level\)\s*\{[\s\S]*?\n\s*\},', 'onSoundLevel: null,', s); s=s.replace('return Row(\n          mainAxisAlignment: MainAxisAlignment.center,', 'return SizedBox(height: 48, child: Row(\n          mainAxisAlignment: MainAxisAlignment.center,').replace('}).toList(),\n        );', '}).toList(),\n        ));'); s=s.replace('width: 160 + (pulse * 30)', 'width: 126 + (pulse * 24)').replace('height: 160 + (pulse * 30)', 'height: 126 + (pulse * 24)').replace('width: 135 + (pulse * 18)', 'width: 110 + (pulse * 14)').replace('height: 135 + (pulse * 18)', 'height: 110 + (pulse * 14)'); new_a = 'Future<void> _analyzeText(String text) async {\n    if (_state == VoiceState.parsed) return;\n    _speechService.stopListening().catchError((_) {});\n    if (text.trim().isEmpty) return;\n    final result = await _aiService.parseVoiceInput(text);\n    if (!mounted) return;\n    if (result.success) {\n      setState(() {\n        _state = VoiceState.parsed;\n        _parseResult = result;\n      });\n      _speechService.speak(result.replyMessage).catchError((_) {});\n    }\n  }'; s=re.sub(r'Future<void> _analyzeText\(String text\) async \{[\s\S]*?\n  \}', new_a, s); open(p,'w').write(s); print('Patched voice_assistant_sheet.dart')"

      - name: 配置 Android 權限與建置參數
        run: |
          echo "flutter.minSdkVersion=26" >> android/local.properties || true
          python3 -c "import os; p='android/app/build.gradle' if os.path.exists('android/app/build.gradle') else ('android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else ''); s=open(p).read() if p else ''; (open(p,'w').write(s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 26').replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion 26').replace('minSdk = flutter.minSdkVersion', 'minSdk = 26').replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true' if 'kts' not in p else 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true') + ('\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n' if 'kts' not in p else '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n')), print('Patched gradle:', p)) if p else None" || true
          python3 -c "p='android/app/src/main/AndroidManifest.xml'; s=open(p).read(); perms='    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>\n    <uses-permission android:name=\"android.permission.USE_EXACT_ALARM\"/>\n    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>\n    <uses-permission android:name=\"android.permission.VIBRATE\"/>\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>'; s=s.replace('<application', perms+'\n    <application') if 'RECORD_AUDIO' not in s else s; s=s.replace('android:label=\"voice_reminder_assistant\"', 'android:label=\"Fit21\"'); open(p,'w').write(s); print('Patched AndroidManifest.xml')" || true
          sed -i 's/android:label="[^"]*"/android:label="Fit21"/g' android/app/src/main/AndroidManifest.xml || true
          rm -rf android/app/src/main/res/mipmap-anydpi* || true
          pip install Pillow || true
          python3 -c "from PIL import Image; im=Image.open('assets/images/app_logo.png').convert('RGBA').resize((192,192)); [im.save(f'android/app/src/main/res/{d}/ic_launcher.png', 'PNG') for d in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']]; [im.save(f'android/app/src/main/res/{d}/ic_launcher_round.png', 'PNG') for d in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']]; print('Green robot launcher icon created successfully!')" || true

      - name: 下載依賴並打包 APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 產出可下載的 APK 安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: Fit21-語音助理-安裝檔
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自動發布到 Releases 下載頁面
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.3
          name: "Fit21 語音提醒助理 v1.0.3 (極速秒辨 + 防抖修復版)"
          body: "Fit21 語音提醒助理 v1.0.3 正式發布！徹底消除智能解析長時間轉圈等待問題（0.001秒瞬時理解），徹底解決點擊說話時畫面抖動問題，畫面超穩定流暢。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
