name: Build Fit21 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 初始化 Android 專案基礎架構
        run: |
          rm -rf android lib test
          flutter create --platforms=android --org com.example --project-name voice_reminder_assistant .
          rm -rf lib test

      - name: 解壓 Fit21 應用程式源碼並修復相容性
        run: |
          python3 -c "import os, zipfile; z=zipfile.ZipFile('fit21-voice-app.zip'); [(os.makedirs(os.path.dirname(p), exist_ok=True) if os.path.dirname(p) else None, open(p, 'wb').write(z.read(m)), print('Extracted:', p)) for m in z.infolist() for p in [m.filename.replace(chr(92), '/')] if not p.endswith('/') and not p.startswith('android/')]"
          python3 -c "p='lib/main.dart'; s=open(p).read().replace('cardTheme: CardTheme(', 'cardTheme: CardThemeData(').replace('void main() async {', 'void main() {').replace('await StorageService().init();', '').replace('await NotificationService().init();', '').replace('await SpeechService().init();', ''); s=s.replace('runApp(', 'ErrorWidget.builder=(details)=>MaterialApp(home:Scaffold(body:Center(child:Text(details.exceptionAsString()))));\n  runApp('); open(p,'w').write(s); print('Patched main.dart')"
          python3 -c "p='lib/services/storage_service.dart'; s=open(p).read().replace('prefs.getStringList', '_prefs?.getStringList').replace('prefs.getString', '_prefs?.getString').replace('prefs.getBool', '_prefs?.getBool').replace('prefs.getDouble', '_prefs?.getDouble'); open(p,'w').write(s); print('Patched storage_service.dart')"
          python3 -c "import re; p='lib/screens/home_screen.dart'; s=open(p).read(); s=s.replace(\"import '../services/storage_service.dart';\", \"import '../services/speech_service.dart';\nimport '../services/storage_service.dart';\"); s=s.replace('void initState() {\n    super.initState();\n    _loadData();\n  }', 'void initState() {\n    super.initState();\n    _loadData();\n    Future.microtask(() async { try { await _storage.init(); if (mounted) _loadData(); } catch(_) {} try { await _notifications.init(); } catch(_) {} try { await SpeechService().init(); } catch(_) {} });\n  }'); s=re.sub(r'final dateStr = DateFormat\(.+?\)\.format\(now\);', 'const w=[\"\",\"星期一\",\"星期二\",\"星期三\",\"星期四\",\"星期五\",\"星期六\",\"星期日\"]; final dateStr=now.month.toString()+\"月\"+now.day.toString()+\"日 \"+w[now.weekday];', s); s=s.replace(\"default: // 'all'\n          return true;\", \"default:\n          return !item.isCompleted;\"); s=s.replace('await _storage.deleteReminder(item.id);\n    await _notifications.cancelReminder(item);\n    _loadData();', 'await _storage.deleteReminder(item.id);\n    _loadData();\n    try { await _notifications.cancelReminder(item); } catch (_) {}'); s=s.replace('final updated = await _storage.toggleComplete(item.id);\n    if (updated != null) {', 'final updated = await _storage.toggleComplete(item.id);\n    _loadData();\n    if (updated != null) { try { if (updated.isCompleted) { await _notifications.cancelReminder(item); } else { await _notifications.scheduleReminder(updated); } } catch (_) {}'); open(p,'w').write(s); print('Patched home_screen.dart')"
          python3 -c "import re; p='lib/models/reminder_item.dart'; s=open(p).read(); s=re.sub(r'String get formattedDate\s*\{[\s\S]*?\}', 'String get formattedDate{if(isToday)return\"今天\";if(isTomorrow)return\"明天\";const w=[\"\",\"一\",\"二\",\"三\",\"四\",\"五\",\"六\",\"日\"];return reminderTime.month.toString()+\"月\"+reminderTime.day.toString()+\"日 (\"+w[reminderTime.weekday]+\")\";}', s); s=re.sub(r'String get formattedTime\s*\{[\s\S]*?\}', 'String get formattedTime{final p=reminderTime.hour<12?\"上午\":\"下午\";final h=reminderTime.hour==0?12:(reminderTime.hour>12?reminderTime.hour-12:reminderTime.hour);final m=reminderTime.minute.toString().padLeft(2,\"0\");return p+\" \"+h.toString()+\":\"+m;}', s); open(p,'w').write(s); print('Patched reminder_item.dart')"
          python3 -c "p='lib/screens/edit_reminder_screen.dart'; s=open(p).read(); s=s.replace(\"final dateStr = DateFormat('yyyy/MM/dd (E)', 'zh_TW').format(_selectedDateTime);\", 'const _w=[\"\",\"一\",\"二\",\"三\",\"四\",\"五\",\"六\",\"日\"]; final dateStr=_selectedDateTime.year.toString()+\"/\"+_selectedDateTime.month.toString().padLeft(2,\"0\")+\"/\"+_selectedDateTime.day.toString().padLeft(2,\"0\")+\" (\"+_w[_selectedDateTime.weekday]+\")\";'); s=s.replace(\"final timeStr = DateFormat('ah:mm', 'zh_TW').format(_selectedDateTime);\", 'final _p=_selectedDateTime.hour<12?\"上午\":\"下午\"; final _h=_selectedDateTime.hour==0?12:(_selectedDateTime.hour>12?_selectedDateTime.hour-12:_selectedDateTime.hour); final _m=_selectedDateTime.minute.toString().padLeft(2,\"0\"); final timeStr=_p+\" \"+_h.toString()+\":\"+_m;'); open(p,'w').write(s); print('Patched edit_reminder_screen.dart')"
          python3 -c "p='lib/services/notification_service.dart'; s=open(p).read().replace('await androidImpl.requestExactAlarmsPermission();', ''); s=s.replace('final id = item.id.hashCode;\n    await _notificationsPlugin.cancel(id);', 'final id = item.id.hashCode & 0x7FFFFFFF;\n    try { await _notificationsPlugin.cancel(id); } catch (_) {}'); s=s.replace('final id = item.id.hashCode;', 'final id = item.id.hashCode & 0x7FFFFFFF;'); open(p,'w').write(s); print('Patched notification_service.dart')"
          python3 -c "import re; p='lib/services/speech_service.dart'; s=open(p).read(); s=re.sub(r'await _tts\.setIosAudioCategory[\s\S]*?\);', '', s); s=s.replace('await _speech.stop();', 'try { await _speech.stop().timeout(const Duration(milliseconds: 500)); } catch (_) {}'); open(p,'w').write(s); print('Patched speech_service.dart')"
          python3 -c "import re; p='lib/widgets/voice_assistant_sheet.dart'; s=open(p).read(); s=s.replace('setState(() {\n            _soundLevel = level;\n          });', '_soundLevel = level;'); s=s.replace('return Row(\n          mainAxisAlignment: MainAxisAlignment.center,', 'return SizedBox(height: 48, child: Row(\n          mainAxisAlignment: MainAxisAlignment.center,').replace('}).toList(),\n        );', '}).toList(),\n        ));'); s=s.replace('width: 160 + (pulse * 30)', 'width: 126 + (pulse * 24)').replace('height: 160 + (pulse * 30)', 'height: 126 + (pulse * 24)').replace('width: 135 + (pulse * 18)', 'width: 110 + (pulse * 14)').replace('height: 135 + (pulse * 18)', 'height: 110 + (pulse * 14)'); s=re.sub(r'final timeStr = DateFormat\(.+?\)\.format\(res\.targetTime\);', 'const _w=[\"\",\"一\",\"二\",\"三\",\"四\",\"五\",\"六\",\"日\"]; final _p=res.targetTime.hour<12?\"上午\":\"下午\"; final _h=res.targetTime.hour==0?12:(res.targetTime.hour>12?res.targetTime.hour-12:res.targetTime.hour); final _m=res.targetTime.minute.toString().padLeft(2,\"0\"); final timeStr=res.targetTime.year.toString()+\"/\"+res.targetTime.month.toString().padLeft(2,\"0\")+\"/\"+res.targetTime.day.toString().padLeft(2,\"0\")+\" \"+_p+_h.toString()+\":\"+_m+\" (\"+_w[res.targetTime.weekday]+\")\";', s); s=s.replace('final result = await _aiService.parseVoiceInput(text);', 'AIParseResult result; try { result = await _aiService.parseVoiceInput(text); } catch (_) { result = AIParseResult(success: true, title: text.trim(), targetTime: DateTime.now().add(const Duration(hours: 1)), category: \"other\", replyMessage: \"已為您記錄\"); }'); s=s.replace('await _speechService.speak(result.replyMessage);', '_speechService.speak(result.replyMessage).catchError((_) {});'); open(p,'w').write(s); print('Patched voice_assistant_sheet.dart')"
          cat << 'PYEOF' > patch_ai.py
          import re
          p = 'lib/services/ai_service.dart'
          s = open(p, encoding='utf-8').read()
          s = s.replace('if (apiKey.isNotEmpty', 'if (false && apiKey.isNotEmpty')
          new_code = '''  int _cnToInt(String s) {
              if (int.tryParse(s) != null) return int.parse(s);
              const digits = {'零': 0, '一': 1, '二': 2, '兩': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9};
              if (s == '十') return 10;
              if (s.startsWith('十')) return 10 + (digits[s.substring(1)] ?? 0);
              if (s.endsWith('十')) return (digits[s.substring(0, 1)] ?? 1) * 10;
              if (s.contains('十')) {
                final parts = s.split('十');
                return (digits[parts[0]] ?? 1) * 10 + (digits[parts[1]] ?? 0);
              }
              return digits[s] ?? 0;
            }

            /// 本機智慧規則解析器 (支援幾月幾號、星期幾、中文數字、時段與自然語意)
            AIParseResult _parseWithLocalRules(String rawText) {
              final now = DateTime.now();
              DateTime targetTime = now;
              bool timeDetected = false;

              String text = rawText;
              text = text.replaceAll('半小時後', '30分鐘後').replaceAll('半個小時後', '30分鐘後');
              text = text.replaceAll('今晚', '今天晚上').replaceAll('明晚', '明天晚上').replaceAll('明早', '明天早上');
              text = text.replaceAllMapped(RegExp(r'([0-9一二兩三四五六七八九十]+)\s*(?:點|時)半'), (m) => '${m.group(1)}點30分');

              // 1. 偵測相對分鐘
              final minMatch = RegExp(r'([0-9一二兩三四五六七八九十]+)\s*(?:個)?分鐘後').firstMatch(text);
              if (minMatch != null) {
                final mins = _cnToInt(minMatch.group(1)!);
                targetTime = now.add(Duration(minutes: mins));
                timeDetected = true;
              }

              // 2. 偵測相對小時
              final hourMatch = RegExp(r'([0-9一二兩三四五六七八九十]+)\s*(?:個)?小時後').firstMatch(text);
              if (!timeDetected && hourMatch != null) {
                final hours = _cnToInt(hourMatch.group(1)!);
                targetTime = now.add(Duration(hours: hours));
                timeDetected = true;
              }

              // 3. 偵測「幾月幾號 / 幾月幾日」或「幾號」 (例如 10月12號, 10月12後, 12號)
              DateTime? specificDate;
              final dateMatch = RegExp(r'(?:([0-9一二兩三四五六七八九十]+)\s*月\s*([0-9一二兩三四五六七八九十]+)\s*(?:日|號|號後|日後|後)?)|(?:([0-9一二兩三四五六七八九十]+)\s*(?:日|號|號後|日後))').firstMatch(text);
              if (dateMatch != null) {
                int month = now.month;
                if (dateMatch.group(1) != null) {
                  month = _cnToInt(dateMatch.group(1)!);
                }
                final dayStr = dateMatch.group(2) ?? dateMatch.group(3)!;
                final day = _cnToInt(dayStr);
                var year = now.year;

                if (day >= 1 && day <= 31 && month >= 1 && month <= 12) {
                  if (dateMatch.group(1) == null && day < now.day) {
                    final nextM = DateTime(year, month + 1, 1);
                    year = nextM.year;
                    month = nextM.month;
                  } else if (dateMatch.group(1) != null && (month < now.month || (month == now.month && day < now.day))) {
                    year += 1;
                  }
                  try {
                    specificDate = DateTime(year, month, day);
                  } catch (_) {}
                }
              }

              // 4. 偵測「星期幾 / 禮拜幾 / 週幾」
              if (specificDate == null) {
                final weekMatch = RegExp(r'(下|這)?\s*(?:週|星期|禮拜)\s*([一二三四五六日天7])').firstMatch(text);
                if (weekMatch != null) {
                  const wMap = {'一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 7, '天': 7, '7': 7};
                  final targetW = wMap[weekMatch.group(2)] ?? 1;
                  var currentW = now.weekday;
                  var diff = targetW - currentW;
                  if (weekMatch.group(1) == '下') {
                    diff += 7;
                  } else if (diff <= 0) {
                    diff += 7;
                  }
                  final d = now.add(Duration(days: diff));
                  specificDate = DateTime(d.year, d.month, d.day);
                }
              }

              // 5. 偵測相對日期 ("明天", "後天", "大後天", "今天")
              int dayOffset = -1;
              if (text.contains('大後天')) {
                dayOffset = 3;
              } else if (text.contains('後天')) {
                dayOffset = 2;
              } else if (text.contains('明天')) {
                dayOffset = 1;
              } else if (text.contains('今天')) {
                dayOffset = 0;
              }

              // 6. 偵測具體時刻
              final timeRegex = RegExp(r'(清晨|凌晨|早晨|早上|上午|中午|下午|傍晚|晚上)?\s*([0-9一二兩三四五六七八九十]+)\s*(?:點|:|時)\s*(?:([0-9一二兩三四五六七八九十]+)(?:分)?)?');
              final match = timeRegex.firstMatch(text);

              if (!timeDetected && (specificDate != null || dayOffset >= 0 || match != null)) {
                int hour = 9; // 若指定日期但未說具體時間，預設上午 9:00
                int minute = 0;
                bool hourExplicitlySet = false;

                if (match != null) {
                  final period = match.group(1);
                  var parsedHour = _cnToInt(match.group(2)!);
                  final minGroup = match.group(3);

                  if (minGroup != null) {
                    minute = _cnToInt(minGroup);
                  }

                  if (period == '下午' || period == '傍晚' || period == '晚上') {
                    if (parsedHour < 12) parsedHour += 12;
                  } else if (period == '中午') {
                    if (parsedHour < 11) parsedHour += 12;
                  } else if (period == null) {
                    if (parsedHour >= 1 && parsedHour <= 6) {
                      parsedHour += 12;
                    } else if (parsedHour >= 7 && parsedHour <= 11) {
                      if (now.hour >= parsedHour) parsedHour += 12;
                    }
                  }
                  hour = parsedHour;
                  hourExplicitlySet = true;
                }

                DateTime date;
                if (specificDate != null) {
                  date = specificDate;
                } else if (dayOffset >= 0) {
                  date = now.add(Duration(days: dayOffset));
                } else {
                  date = now;
                }

                targetTime = DateTime(date.year, date.month, date.day, hour, minute);

                if (specificDate == null && dayOffset <= 0 && targetTime.isBefore(now) && hourExplicitlySet) {
                  targetTime = targetTime.add(const Duration(days: 1));
                }
                timeDetected = true;
              }

              if (!timeDetected) {
                targetTime = now.add(const Duration(hours: 1));
              }

              // 7. 清理事項標題
              String cleanTitle = text
                  .replaceAll(RegExp(r'^(提醒我|幫我記一下|幫我記|記得要|記得|要|我想記|請提醒我|請幫我|請記得)\s*'), '')
                  .replaceAll(RegExp(r'(?:[0-9一二兩三四五六七八九十]+\s*月\s*[0-9一二兩三四五六七八九十]+\s*(?:日|號|號後|日後|後)?)|(?:[0-9一二兩三四五六七八九十]+\s*(?:日|號|號後|日後))'), '')
                  .replaceAll(RegExp(r'(下|這)?\s*(?:週|星期|禮拜)\s*[一二三四五六日天7]'), '')
                  .replaceAll(RegExp(r'(今天|明天|後天|大後天|今晚|明晚|明早)'), '')
                  .replaceAll(RegExp(r'(清晨|凌晨|早晨|早上|上午|中午|下午|傍晚|晚上)?\s*[0-9一二兩三四五六七八九十]+\s*(?:點|:|時)(?:[0-9一二兩三四五六七八九十]+)?(?:分)?'), '')
                  .replaceAll(RegExp(r'[0-9一二兩三四五六七八九十]+\s*(?:個)?(?:分鐘|小時)後'), '')
                  .replaceAll(RegExp(r'(的事情|的代辦|的待辦|提醒|記得)'), '')
                  .replaceAll(RegExp(r'^(去|要|來|去提醒|去記得|去停止|後去|後要)\s*'), '')
                  .replaceAll(RegExp(r'^[，,、\s]+|[，,、\s]+$'), '')
                  .trim();

              if (cleanTitle.isEmpty) cleanTitle = rawText.trim();

              String category = 'other';
              if (cleanTitle.contains('會') || cleanTitle.contains('工作') || cleanTitle.contains('報告') || cleanTitle.contains('專案') || cleanTitle.contains('客戶') || cleanTitle.contains('主管') || cleanTitle.contains('課程') || cleanTitle.contains('學習')) {
                category = 'work';
              } else if (cleanTitle.contains('買') || cleanTitle.contains('繳費') || cleanTitle.contains('拿') || cleanTitle.contains('回家') || cleanTitle.contains('吃飯') || cleanTitle.contains('超市')) {
                category = 'life';
              } else if (cleanTitle.contains('吃藥') || cleanTitle.contains('看醫生') || cleanTitle.contains('診所') || cleanTitle.contains('運動') || cleanTitle.contains('跑步') || cleanTitle.contains('喝水')) {
                category = 'health';
              } else if (cleanTitle.contains('緊急') || cleanTitle.contains('立刻') || cleanTitle.contains('重要') || cleanTitle.contains('馬上') || cleanTitle.contains('火速') || cleanTitle.contains('停止')) {
                category = 'urgent';
              }

              final _p = targetTime.hour < 12 ? '上午' : '下午';
              final _h = targetTime.hour == 0 ? 12 : (targetTime.hour > 12 ? targetTime.hour - 12 : targetTime.hour);
              final _m = targetTime.minute.toString().padLeft(2, '0');
              final timeDesc = '${targetTime.month}月${targetTime.day}日 ' + _p + _h.toString() + ':' + _m;
              final replyMessage = '好的！已為您設定 ' + timeDesc + ' 提醒：' + cleanTitle + '。';

              return AIParseResult(
                success: true,
                title: cleanTitle,
                targetTime: targetTime,
                category: category,
                replyMessage: replyMessage,
              );
            }
          }
          '''
          idx = s.find('AIParseResult _parseWithLocalRules')
          if idx != -1:
              s = s[:idx] + new_code.strip() + '\n'
              open(p, 'w', encoding='utf-8').write(s)
              print('Patched ai_service.dart successfully!')
          else:
              print('Error: _parseWithLocalRules not found!')
              exit(1)
          PYEOF
          python3 patch_ai.py

      - name: 配置 Android 權限與建置參數
        run: |
          echo "flutter.minSdkVersion=26" >> android/local.properties || true
          python3 -c "import os; p='android/app/build.gradle' if os.path.exists('android/app/build.gradle') else ('android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else ''); s=open(p).read() if p else ''; (open(p,'w').write(s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 26').replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion 26').replace('minSdk = flutter.minSdkVersion', 'minSdk = 26').replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true' if 'kts' not in p else 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true') + ('\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n' if 'kts' not in p else '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n')), print('Patched gradle:', p)) if p else None" || true
          python3 -c "p='android/app/src/main/AndroidManifest.xml'; s=open(p).read(); perms='    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>\n    <uses-permission android:name=\"android.permission.USE_EXACT_ALARM\"/>\n    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>\n    <uses-permission android:name=\"android.permission.VIBRATE\"/>\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>'; s=s.replace('<application', perms+'\n    <application') if 'RECORD_AUDIO' not in s else s; s=s.replace('android:label=\"voice_reminder_assistant\"', 'android:label=\"Fit21\"'); open(p,'w').write(s); print('Patched AndroidManifest.xml')" || true
          sed -i 's/android:label="[^"]*"/android:label="Fit21"/g' android/app/src/main/AndroidManifest.xml || true
          rm -rf android/app/src/main/res/mipmap-anydpi* || true
          pip install Pillow || true
          python3 -c "from PIL import Image; im=Image.open('assets/images/app_logo.png').convert('RGBA').resize((192,192)); [im.save(f'android/app/src/main/res/{d}/ic_launcher.png', 'PNG') for d in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']]; [im.save(f'android/app/src/main/res/{d}/ic_launcher_round.png', 'PNG') for d in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']]; print('Green robot launcher icon created successfully!')" || true

      - name: 下載依賴並打包 APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 產出可下載的 APK 安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: Fit21-語音助理-安裝檔
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自動發布到 Releases 下載頁面
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.8
          name: "Fit21 語音提醒助理 v1.0.8 (真萬年曆與月日日期理解版)"
          body: "Fit21 語音提醒助理 v1.0.8 正式發布！全面支援完整月日與星期日期理解：\n1. 支援「幾月幾號 / 幾月幾日 / 幾號」（例如「10月12號去停止大師課程」），精準設定為 10月12日 09:00！\n2. 支援「星期幾 / 禮拜幾 / 下週幾」（例如「下週一早上開會」）！\n3. 支援全中文數字與時段推斷（「下午三點」、「十分鐘後」）！\n4. 事項標題智慧過濾雜訊，自動提煉最乾淨的事項！\n5. 延續 0 秒完成即時歸檔與 0 秒秒速刪除！"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
