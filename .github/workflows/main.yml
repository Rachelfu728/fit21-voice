name: Build Fit21 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 解壓縮專案
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('fit21-voice-app.zip').extractall('.')" || tar -xf fit21-voice-app.zip || unzip -o fit21-voice-app.zip || true
          python3 -c "p='lib/services/speech_service.dart'; lines=[l for l in open(p) if not any(k in l for k in ['setIosAudioCategory','ambientSolo','defaultToSpeaker','allowBluetooth','IosTextToSpeech'])]; open(p,'w').writelines(lines)" || true

      - name: 設定 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 重建標準 Android 架構
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle* 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle* 2>/dev/null || true
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml || true
          python3 -c "import shutil, glob, os; [shutil.copy('assets/images/app_logo.png', os.path.join(d, 'ic_launcher.png')) for d in glob.glob('android/app/src/main/res/mipmap-*')]" || true

      - name: 下載依賴套件
        run: flutter pub get

      - name: 打包 Android 安裝檔 (APK)
        run: flutter build apk --release

      - name: 產出可下載的 APK 安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: Fit21-語音助理-安裝檔
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自動發布到 Releases 下載頁面
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Fit21 語音提醒助理 v1.0.0 (安裝包)"
          body: "Fit21 AI 語音提醒助理 Android 安裝檔。下載下方 app-release.apk 即可安裝到手機！"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
