name: Build Fit21 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 初始化 Android 專案基礎架構
        run: |
          rm -rf android lib test
          flutter create --platforms=android --org com.example --project-name voice_reminder_assistant .
          rm -rf lib test
          echo "flutter.minSdkVersion=26" >> android/local.properties || true
          rm -rf android/app/src/main/res/mipmap-anydpi* || true
          pip install Pillow || true

      - name: 解壓源碼並套用完整修復
        shell: python
        run: |
          import os, sys, re, zipfile

          # 1. 解壓源碼
          z = zipfile.ZipFile('fit21-voice-app.zip')
          for m in z.infolist():
              p = m.filename.replace('\\', '/')
              if not p.endswith('/') and not p.startswith('android/'):
                  d = os.path.dirname(p)
                  if d:
                      os.makedirs(d, exist_ok=True)
                  with open(p, 'wb') as f:
                      f.write(z.read(m))
                  print('Extracted:', p)

          # 2. 修復 main.dart (加入 ErrorWidget 防白屏與 Material3 卡片修正)
          p = 'lib/main.dart'
          s = open(p, 'r', encoding='utf-8', errors='ignore').read()
          s = s.replace('cardTheme: CardTheme(', 'cardTheme: CardThemeData(')
          s = s.replace('void main() async {', 'void main() {')
          s = s.replace('await StorageService().init();', '')
          s = s.replace('await NotificationService().init();', '')
          s = s.replace('await SpeechService().init();', '')
          s = s.replace('runApp(', 'ErrorWidget.builder = (details) => MaterialApp(home: Scaffold(body: Center(child: Padding(padding: const EdgeInsets.all(24.0), child: Text(details.exceptionAsString())))));\n  runApp(')
          open(p, 'w', encoding='utf-8').write(s)
          print('Patched main.dart')

          # 3. 修復 storage_service.dart
          p = 'lib/services/storage_service.dart'
          s = open(p, 'r', encoding='utf-8', errors='ignore').read()
          s = s.replace('prefs.getStringList', '_prefs?.getStringList')
          s = s.replace('prefs.getString', '_prefs?.getString')
          s = s.replace('prefs.getBool', '_prefs?.getBool')
          s = s.replace('prefs.getDouble', '_prefs?.getDouble')
          open(p, 'w', encoding='utf-8').write(s)
          print('Patched storage_service.dart')

          # 4. 修復 reminder_item.dart
          p = 'lib/models/reminder_item.dart'
          s = open(p, 'r', encoding='utf-8', errors='ignore').read()
          s = re.sub(r'String get formattedDate\s*\{[\s\S]*?\}', 'String get formattedDate { if (isToday) return "今天"; if (isTomorrow) return "明天"; const w = ["", "一", "二", "三", "四", "五", "六", "日"]; return "${reminderTime.month}月${reminderTime.day}日 (" + w[reminderTime.weekday] + ")"; }', s)
          s = re.sub(r'String get formattedTime\s*\{[\s\S]*?\}', 'String get formattedTime { final p = reminderTime.hour < 12 ? "上午" : "下午"; final h = reminderTime.hour == 0 ? 12 : (reminderTime.hour > 12 ? reminderTime.hour - 12 : reminderTime.hour); final m = reminderTime.minute.toString().padLeft(2, "0"); return "$p $h:$m"; }', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('Patched reminder_item.dart')

          # 5. 修復 home_screen.dart
          p = 'lib/screens/home_screen.dart'
          s = open(p, 'r', encoding='utf-8', errors='ignore').read()
          s = s.replace("import '../services/storage_service.dart';", "import '../services/speech_service.dart';\nimport '../services/storage_service.dart';")
          s = re.sub(r'void initState\(\)\s*\{[\s\S]*?_loadData\(\);[\s\S]*?\}', 'void initState() {\n    super.initState();\n    _loadData();\n    Future.microtask(() async { try { await _storage.init(); if (mounted) _loadData(); } catch(_) {} try { await _notifications.init(); } catch(_) {} try { await SpeechService().init(); } catch(_) {} });\n  }', s)
          s = re.sub(r'final dateStr = DateFormat\(.+?\)\.format\(now\);', 'const w = ["", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六", "星期日"]; final dateStr = "${now.month}月${now.day}日 " + w[now.weekday];', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('Patched home_screen.dart')

          # 6. 修復 edit_reminder_screen.dart
          p = 'lib/screens/edit_reminder_screen.dart'
          s = open(p, 'r', encoding='utf-8', errors='ignore').read()
          s = re.sub(r'final dateStr = DateFormat\(.+?\)\.format\(_selectedDateTime\);', 'const w = ["", "一", "二", "三", "四", "五", "六", "日"]; final dateStr = "${_selectedDateTime.year}/${_selectedDateTime.month.toString().padLeft(2, "0")}/${_selectedDateTime.day.toString().padLeft(2, "0")} (" + w[_selectedDateTime.weekday] + ")";', s)
          s = re.sub(r'final timeStr = DateFormat\(.+?\)\.format\(_selectedDateTime\);', 'final p = _selectedDateTime.hour < 12 ? "上午" : "下午"; final h = _selectedDateTime.hour == 0 ? 12 : (_selectedDateTime.hour > 12 ? _selectedDateTime.hour - 12 : _selectedDateTime.hour); final m = _selectedDateTime.minute.toString().padLeft(2, "0"); final timeStr = "$p $h:$m";', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('Patched edit_reminder_screen.dart')

          # 7. 修復 ai_service.dart
          p = 'lib/services/ai_service.dart'
          s = open(p, 'r', encoding='utf-8', errors='ignore').read()
          s = re.sub(r'final nowStr = DateFormat\(.+?\)\.format\(now\);', 'final nowStr = "${now.year}-${now.month.toString().padLeft(2, "0")}-${now.day.toString().padLeft(2, "0")} ${now.hour.toString().padLeft(2, "0")}:${now.minute.toString().padLeft(2, "0")}";', s)
          s = re.sub(r'final timeDesc = DateFormat\(.+?\)\.format\(targetTime\);', 'final p = targetTime.hour < 12 ? "上午" : "下午"; final h = targetTime.hour == 0 ? 12 : (targetTime.hour > 12 ? targetTime.hour - 12 : targetTime.hour); final m = targetTime.minute.toString().padLeft(2, "0"); final timeDesc = "${targetTime.month}月${targetTime.day}日 $p $h:$m";', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('Patched ai_service.dart')

          # 8. 修復 voice_assistant_sheet.dart
          p = 'lib/widgets/voice_assistant_sheet.dart'
          s = open(p, 'r', encoding='utf-8', errors='ignore').read()
          s = re.sub(r'final timeStr = DateFormat\(.+?\)\.format\(res\.targetTime\);', 'final p = res.targetTime.hour < 12 ? "上午" : "下午"; final h = res.targetTime.hour == 0 ? 12 : (res.targetTime.hour > 12 ? res.targetTime.hour - 12 : res.targetTime.hour); final m = res.targetTime.minute.toString().padLeft(2, "0"); const w = ["", "一", "二", "三", "四", "五", "六", "日"]; final timeStr = "${res.targetTime.year}/${res.targetTime.month.toString().padLeft(2, "0")}/${res.targetTime.day.toString().padLeft(2, "0")} $p $h:$m (" + w[res.targetTime.weekday] + ")";', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('Patched voice_assistant_sheet.dart')

          # 9. 修復 notification_service.dart
          p = 'lib/services/notification_service.dart'
          s = open(p, 'r', encoding='utf-8', errors='ignore').read().replace('await androidImpl.requestExactAlarmsPermission();', '')
          open(p, 'w', encoding='utf-8').write(s)
          print('Patched notification_service.dart')

          # 10. 修復 speech_service.dart
          p = 'lib/services/speech_service.dart'
          s = open(p, 'r', encoding='utf-8', errors='ignore').read()
          s = re.sub(r'await _tts\.setIosAudioCategory[\s\S]*?\);', '', s)
          s = s.replace('partialResults: true,', '').replace('cancelOnError: false,', '')
          s = re.sub(r'listenMode:\s*stt
