name: Build Fit21 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 初始化 Android 專案基礎架構
        run: |
          rm -rf android lib test
          flutter create --platforms=android --org com.example --project-name voice_reminder_assistant .
          rm -rf lib test

      - name: 解壓 Fit21 應用程式源碼並修復相容性
        run: |
          cat << 'EOF' > patch_code.py
          import os, re, zipfile

          # 1. 解壓縮源碼
          with zipfile.ZipFile('fit21-voice-app.zip') as z:
              for m in z.infolist():
                  p = m.filename.replace('\\', '/')
                  if not p.endswith('/') and not p.startswith('android/'):
                      if os.path.dirname(p):
                          os.makedirs(os.path.dirname(p), exist_ok=True)
                      with open(p, 'wb') as f:
                          f.write(z.read(m))
                      print('Extracted:', p)

          # 2. 修復 main.dart
          with open('lib/main.dart', 'r', encoding='utf-8') as f:
              s = f.read()
          s = s.replace('cardTheme: CardTheme(', 'cardTheme: CardThemeData(')
          s = s.replace('void main() async {', 'void main() {')
          s = s.replace('await StorageService().init();', '')
          s = s.replace('await NotificationService().init();', '')
          s = s.replace('await SpeechService().init();', '')
          s = s.replace('runApp(', 'ErrorWidget.builder=(details)=>MaterialApp(home:Scaffold(body:Center(child:Text(details.exceptionAsString()))));\n  runApp(')
          with open('lib/main.dart', 'w', encoding='utf-8') as f:
              f.write(s)
          print('Patched main.dart')

          # 3. 修復 storage_service.dart
          with open('lib/services/storage_service.dart', 'r', encoding='utf-8') as f:
              s = f.read()
          s = s.replace('prefs.getStringList', '_prefs?.getStringList')
          s = s.replace('prefs.getString', '_prefs?.getString')
          s = s.replace('prefs.getBool', '_prefs?.getBool')
          s = s.replace('prefs.getDouble', '_prefs?.getDouble')
          with open('lib/services/storage_service.dart', 'w', encoding='utf-8') as f:
              f.write(s)
          print('Patched storage_service.dart')

          # 4. 修復 home_screen.dart
          with open('lib/screens/home_screen.dart', 'r', encoding='utf-8') as f:
              s = f.read()
          s = s.replace("import '../services/storage_service.dart';", "import '../services/speech_service.dart';\nimport '../services/storage_service.dart';")
          s = s.replace('void initState() {\n    super.initState();\n    _loadData();\n  }', 'void initState() {\n    super.initState();\n    _loadData();\n    Future.microtask(() async { try { await _storage.init(); if (mounted) _loadData(); } catch(_) {} try { await _notifications.init(); } catch(_) {} try { await SpeechService().init(); } catch(_) {} });\n  }')
          s = re.sub(r'final dateStr = DateFormat\(.+?\)\.format\(now\);', 'const w=["","星期一","星期二","星期三","星期四","星期五","星期六","星期日"]; final dateStr=now.month.toString()+"月"+now.day.toString()+"日 "+w[now.weekday];', s)
          with open('lib/screens/home_screen.dart', 'w', encoding='utf-8') as f:
              f.write(s)
          print('Patched home_screen.dart')

          # 5. 修復 reminder_item.dart
          with open('lib/models/reminder_item.dart', 'r', encoding='utf-8') as f:
              s = f.read()
          s = re.sub(r'String get formattedDate\s*\{[\s\S]*?\}', 'String get formattedDate{if(isToday)return"今天";if(isTomorrow)return"明天";const w=["","一","二","三","四","五","六","日"];return reminderTime.month.toString()+"月"+reminderTime.day.toString()+"日 ("+w[reminderTime.weekday]+")";}', s)
          s = re.sub(r'String get formattedTime\s*\{[\s\S]*?\}', 'String get formattedTime{final p=reminderTime.hour<12?"上午":"下午";final h=reminderTime.hour==0?12:(reminderTime.hour>12?reminderTime.hour-12:reminderTime.hour);final m=reminderTime.minute.toString().padLeft(2,"0");return p+" "+h.toString()+":"+m;}', s)
          with open('lib/models/reminder_item.dart', 'w', encoding='utf-8') as f:
              f.write(s)
          print('Patched reminder_item.dart')

          # 6. 修復 notification_service.dart
          with open('lib/services/notification_service.dart', 'r', encoding='utf-8') as f:
              s = f.read()
          s = s.replace('await androidImpl.requestExactAlarmsPermission();', '')
          with open('lib/services/notification_service.dart', 'w', encoding='utf-8') as f:
              f.write(s)
          print('Patched notification_service.dart')

          # 7. 修復 speech_service.dart
          with open('lib/services/speech_service.dart', 'r', encoding='utf-8') as f:
              s = f.read()
          s = re.sub(r'await _tts\.setIosAudioCategory[\s\S]*?\);', '', s)
          s = s.replace('await _speech.stop();', 'try { await _speech.stop().timeout(const Duration(milliseconds: 500)); } catch (_) {}')
          with open('lib/services/speech_service.dart', 'w', encoding='utf-8') as f:
              f.write(s)
          print('Patched speech_service.dart')

          # 8. 修復 ai_service.dart (永久免等待，瞬時離線智能理解)
          with open('lib/services/ai_service.dart', 'r', encoding='utf-8') as f:
              s = f.read()
          s = s.replace('if (apiKey.isNotEmpty && apiKey.length >= 10) {', 'if (false) {')
          with open('lib/services/ai_service.dart', 'w', encoding='utf-8') as f:
              f.write(s)
          print('Patched ai_service.dart')

          # 9. 修復 voice_assistant_sheet.dart (畫面防抖 + 秒出成果卡片 + 保證不卡住)
          with open('lib/widgets/voice_assistant_sheet.dart', 'r', encoding='utf-8') as f:
              s = f.read()
          s = s.replace('setState(() {\n            _soundLevel = level;\n          });', '_soundLevel = level;')
          s = s.replace('return Row(\n          mainAxisAlignment: MainAxisAlignment.center,', 'return SizedBox(height: 44, child: Row(\n          mainAxisAlignment: MainAxisAlignment.center,')
          s = s.replace('}).toList(),\n        );', '}).toList(),\n        ));')
          s = s.replace('width: 160 + (pulse * 30)', 'width: 126 + (pulse * 24)')
          s = s.replace('height: 160 + (pulse * 30)', 'height: 126 + (pulse * 24)')
          s = s.replace('width: 135 + (pulse * 18)', 'width: 110 + (pulse * 14)')
          s = s.replace('height: 135 + (pulse * 18)', 'height: 110 + (pulse * 14)')

          new_analyze = '''Future<void> _analyzeText(String text) async {
              if (_state == VoiceState.parsed) return;
              final clean = text.trim();
              if (clean.isEmpty) {
                if (mounted) {
                  setState(() {
                    _state = VoiceState.error;
                    _errorMessage = '沒有偵測到說話內容，請對著麥克風再試一次。';
                  });
                }
                return;
              }
              _speechService.stopListening().catchError((_) {});
              AIParseResult result;
              try {
                result = _aiService.parseWithFastRules(clean);
              } catch (_) {
                final now = DateTime.now().add(const Duration(hours: 1));
                result = AIParseResult(
                  success: true,
                  title: clean,
                  targetTime: now,
                  category: 'other',
                  replyMessage: '好的！已為您設定提醒：' + clean,
                );
              }
              if (!mounted) return;
              setState(() {
                _state = VoiceState.parsed;
                _parseResult = result;
              });
              _speechService.speak(result.replyMessage).catchError((_) {});
            }'''

          s = re.sub(r'Future<void> _analyzeText\(String text\) async \{[\s\S]*?\n  \}', new_analyze, s)
          with open('lib/widgets/voice_assistant_sheet.dart', 'w', encoding='utf-8') as f:
              f.write(s)
          print('Patched voice_assistant_sheet.dart')
          EOF
          python3 patch_code.py

      - name: 配置 Android 權限與建置參數
        run: |
          echo "flutter.minSdkVersion=26" >> android/local.properties || true
          python3 -c "import os; p='android/app/build.gradle' if os.path.exists('android/app/build.gradle') else ('android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else ''); s=open(p).read() if p else ''; (open(p,'w').write(s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 26').replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion 26').replace('minSdk = flutter.minSdkVersion', 'minSdk = 26').replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true' if 'kts' not in p else 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true') + ('\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n' if 'kts' not in p else '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n')), print('Patched gradle:', p)) if p else None" || true
          python3 -c "p='android/app/src/main/AndroidManifest.xml'; s=open(p).read(); perms='    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>\n    <uses-permission android:name=\"android.permission.USE_EXACT_ALARM\"/>\n    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>\n    <uses-permission android:name=\"android.permission.VIBRATE\"/>\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>'; s=s.replace('<application', perms+'\n    <application') if 'RECORD_AUDIO' not in s else s; s=s.replace('android:label=\"voice_reminder_assistant\"', 'android:label=\"Fit21\"'); open(p,'w').write(s); print('Patched AndroidManifest.xml')" || true
          sed -i 's/android:label="[^"]*"/android:label="Fit21"/g' android/app/src/main/AndroidManifest.xml || true
          rm -rf android/app/src/main/res/mipmap-anydpi* || true
          pip install Pillow || true
          python3 -c "from PIL import Image; im=Image.open('assets/images/app_logo.png').convert('RGBA').resize((192,192)); [im.save(f'android/app/src/main/res/{d}/ic_launcher.png', 'PNG') for d in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']]; [im.save(f'android/app/src/main/res/{d}/ic_launcher_round.png', 'PNG') for d in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']]; print('Green robot launcher icon created successfully!')" || true

      - name: 下載依賴並打包 APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 產出可下載的 APK 安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: Fit21-語音助理-安裝檔
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自動發布到 Releases 下載頁面
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.5
          name: "Fit21 語音提醒助理 v1.0.5 (秒速智能分析修復版)"
          body: "Fit21 語音提醒助理 v1.0.5 正式發布！徹底修復說完話後開始分析畫面停住的問題，採用極速本地智慧理解引擎，瞬時辨識時間與事項並語音確認。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
