name: Build Fit21 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 解壓縮專案並修復檔案
        run: |
          python3 -c "import textwrap; exec(textwrap.dedent('''
          import os, zipfile
          if os.path.exists('fit21-voice-app.zip'):
              with zipfile.ZipFile('fit21-voice-app.zip', 'r') as z:
                  for m in z.infolist():
                      name = m.filename.replace(chr(92), '/').strip('/')
                      if not name:
                          continue
                      if m.is_dir() or name.endswith('/'):
                          os.makedirs(name, exist_ok=True)
                      else:
                          parent = os.path.dirname(name)
                          if parent:
                              os.makedirs(parent, exist_ok=True)
                          with z.open(m) as src, open(name, 'wb') as dst:
                              dst.write(src.read())

          sp = 'lib/services/speech_service.dart'
          if os.path.exists(sp):
              lines = []
              skip = False
              with open(sp, 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      if 'setIosAudioCategory' in line or 'IosTextToSpeechAudioCategory' in line:
                          skip = True
                      if skip:
                          if ');' in line:
                              skip = False
                          continue
                      lines.append(line)
              with open(sp, 'w', encoding='utf-8') as f:
                  f.writelines(lines)
          '''))"

      - name: 重建標準 Android 架構與設定
        run: |
          mkdir -p /tmp/backup_fit21
          cp -r lib /tmp/backup_fit21/
          cp pubspec.yaml /tmp/backup_fit21/
          if [ -d "assets" ]; then cp -r assets /tmp/backup_fit21/; fi

          rm -rf android
          flutter create --platforms=android --org com.example .

          cp -rf /tmp/backup_fit21/lib/* lib/
          cp -f /tmp/backup_fit21/pubspec.yaml pubspec.yaml
          if [ -d "/tmp/backup_fit21/assets" ]; then cp -rf /tmp/backup_fit21/assets/* assets/; fi

          python3 -c "import textwrap; exec(textwrap.dedent('''
          import os, re, glob, shutil

          for g in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(g):
                  c = open(g, 'r', encoding='utf-8').read()
                  c = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 26', c)
                  c = re.sub(r'minSdkVersion\s*=.*', 'minSdkVersion = 26', c)
                  c = re.sub(r'minSdk\s*=.*', 'minSdk = 26', c)
                  c = re.sub(r'minSdk\s+.*', 'minSdk 26', c)
                  if 'coreLibraryDesugaringEnabled' not in c and 'isCoreLibraryDesugaringEnabled' not in c:
                      c = re.sub(r'(compileOptions\s*\{)', r'\1\n        coreLibraryDesugaringEnabled true', c)
                  if 'coreLibraryDesugaring' not in c:
                      c += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n'
                  open(g, 'w', encoding='utf-8').write(c)

          with open('android/local.properties', 'a') as f:
              f.write('\nflutter.minSdkVersion=26\n')

          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              m = open(manifest, 'r', encoding='utf-8').read()
              perms = ['INTERNET', 'RECORD_AUDIO', 'POST_NOTIFICATIONS', 'SCHEDULE_EXACT_ALARM', 'USE_EXACT_ALARM', 'RECEIVE_BOOT_COMPLETED', 'VIBRATE', 'WAKE_LOCK']
              tag_lines = '\n' + '\n'.join(['    <uses-permission android:name=\"android.permission.' + p + '\" />' for p in perms]) + '\n'
              if 'RECORD_AUDIO' not in m:
                  m = m.replace('<manifest', '<manifest' + tag_lines, 1)
              m = re.sub(r'android:label=\"[^\"]*\"', 'android:
