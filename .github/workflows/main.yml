name: Build Fit21 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 解壓縮專案並修復路徑結構
        run: |
          python3 -c "
          import os, zipfile

          zip_name = 'fit21-voice-app.zip'
          if os.path.exists(zip_name):
              with zipfile.ZipFile(zip_name, 'r') as zf:
                  for member in zf.infolist():
                      clean_name = member.filename.replace(chr(92), '/').strip('/')
                      if not clean_name:
                          continue
                      if member.is_dir() or clean_name.endswith('/'):
                          os.makedirs(clean_name, exist_ok=True)
                      else:
                          os.makedirs(os.path.dirname(clean_name), exist_ok=True)
                          with zf.open(member) as src, open(clean_name, 'wb') as dst:
                              dst.write(src.read())
              print('Zip extracted successfully.')

          speech_file = 'lib/services/speech_service.dart'
          if os.path.exists(speech_file):
              lines = []
              skip = False
              with open(speech_file, 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      if 'setIosAudioCategory' in line or 'IosTextToSpeechAudioCategory' in line:
                          skip = True
                      if skip:
                          if ');' in line:
                              skip = False
                          continue
                      lines.append(line)
              with open(speech_file, 'w', encoding='utf-8') as f:
                  f.writelines(lines)
              print('speech_service.dart checked and cleaned.')
          "

      - name: 重建標準 Android 架構與設定
        run: |
          mkdir -p /tmp/backup_fit21
          cp -r lib /tmp/backup_fit21/
          cp pubspec.yaml /tmp/backup_fit21/
          if [ -d "assets" ]; then cp -r assets /tmp/backup_fit21/; fi

          rm -rf android
          flutter create --platforms=android --org com.example .

          cp -rf /tmp/backup_fit21/lib/* lib/
          cp -f /tmp/backup_fit21/pubspec.yaml pubspec.yaml
          if [ -d "/tmp/backup_fit21/assets" ]; then cp -rf /tmp/backup_fit21/assets/* assets/; fi

          python3 -c "
          import os, re, glob, shutil

          for gradle_file in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(gradle_file):
                  c = open(gradle_file, 'r', encoding='utf-8').read()
                  c = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 26', c)
                  c = re.sub(r'minSdkVersion\s*=.*', 'minSdkVersion = 26', c)
                  c = re.sub(r'minSdk\s*=.*', 'minSdk = 26', c)
                  c = re.sub(r'minSdk\s+.*', 'minSdk 26', c)
                  
                  if 'coreLibraryDesugaringEnabled' not in c and 'isCoreLibraryDesugaringEnabled' not in c:
                      c = re.sub(r'(compileOptions\s*\{)', r'\1\n        coreLibraryDesugaringEnabled true', c)
                  
                  if 'coreLibraryDesugaring' not in c:
                      c += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n'
                  
                  open(gradle_file, 'w', encoding='utf-8').write(c)

          with open('android/local.properties', 'a') as f:
              f.write('\nflutter.minSdkVersion=26\n')

          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              m = open(manifest, 'r', encoding='utf-8').read()
              perms = '''
    <uses-permission android:name=\"android.permission.INTERNET\" />
    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />
    <uses-permission android:name=\"android.permission.USE_EXACT_ALARM\" />
    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />
    <uses-permission android:name=\"android.permission.VIBRATE\" />
    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />
'''
              if 'RECORD_AUDIO' not in m:
                  m = m.replace('<manifest', '<manifest\n' + perms, 1)
              m = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"Fit21 語音提醒\"', m)
              open(manifest, 'w', encoding='utf-8').write(m)

          if os.path.exists('assets/images/app_logo.png'):
              for d in glob.glob('android/app/src/main/res/mipmap-*'):
                  shutil.copy('assets/images/app_logo.png', os.path.join(d, 'ic_launcher.png'))
          "

      - name: 下載依賴套件
        run: flutter pub get

      - name: 打包 Android 安裝檔 (APK)
        run: flutter build apk --release

      - name: 產出可下載的 APK 安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: Fit21-語音助理-安裝檔
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自動發布到 Releases 下載頁面
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Fit21 語音提醒助理 v1.0.0"
          body: "Fit21 AI 語音提醒助理 Android 安裝檔。點擊下方 app-release.apk 即可下載並安裝到手機！"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
