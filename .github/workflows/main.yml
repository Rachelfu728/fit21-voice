            Widget _buildDynamicMicrophone() {
              return SizedBox(
                width: 160,
                height: 160,
                child: AnimatedBuilder(
                  animation: _animController,
                  builder: (context, child) {
                    final pulse = _animController.value;

                    return Stack(
                      alignment: Alignment.center,
                      children: [
                        Container(
                          width: 126 + (pulse * 26),
                          height: 126 + (pulse * 26),
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            color: const Color(0xFF22C55E).withOpacity((0.15 - (pulse * 0.1)).clamp(0.03, 0.18)),
                          ),
                        ),
                        Container(
                          width: 110 + (pulse * 14),
                          height: 110 + (pulse * 14),
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            color: const Color(0xFF16A34A).withOpacity((0.25 - (pulse * 0.1)).clamp(0.08, 0.28)),
                          ),
                        ),
                        GestureDetector(
                          onTap: () {
                            if (_spokenText.isNotEmpty) {
                              _analyzeText(_spokenText);
                            }
                          },
                          child: Container(
                            width: 92,
                            height: 92,
                            decoration: BoxDecoration(
                              shape: BoxShape.circle,
                              gradient: const LinearGradient(
                                colors: [
                                  Color(0xFF22C55E),
                                  Color(0xFF15803D),
                                ],
                                begin: Alignment.topLeft,
                                end: Alignment.bottomRight,
                              ),
                              boxShadow: [
                                BoxShadow(
                                  color: const Color(0xFF16A34A).withOpacity(0.4),
                                  blurRadius: 18,
                                  spreadRadius: 2,
                                  offset: const Offset(0, 6),
                                ),
                              ],
                            ),
                            child: Stack(
                              alignment: Alignment.center,
                              children: [
                                Container(
                                  width: 82,
                                  height: 82,
                                  decoration: BoxDecoration(
                                    shape: BoxShape.circle,
                                    border: Border.all(
                                      color: Colors.white.withOpacity(0.35),
                                      width: 2,
                                    ),
                                  ),
                                ),
                                const Icon(
                                  Icons.mic_rounded,
                                  color: Colors.white,
                                  size: 48,
                                ),
                              ],
                            ),
                          ),
                        ),
                      ],
                    );
                  },
                ),
              );
            }

            Widget _buildAudioWaveBars() {
              return SizedBox(
                height: 38,
                child: AnimatedBuilder(
                  animation: _animController,
                  builder: (context, child) {
                    final val = _animController.value;
                    final heights = [
                      10.0 + math.sin(val * math.pi) * 12.0,
                      15.0 + math.cos(val * math.pi) * 14.0,
                      20.0 + math.sin((val + 0.3) * math.pi) * 14.0,
                      26.0 + math.cos((val + 0.5) * math.pi) * 10.0,
                      20.0 + math.sin((val + 0.7) * math.pi) * 14.0,
                      15.0 + math.cos(val * math.pi) * 14.0,
                      10.0 + math.sin(val * math.pi) * 12.0,
                    ];

                    return Row(
                      mainAxisAlignment: MainAxisAlignment.center,
                      crossAxisAlignment: CrossAxisAlignment.center,
                      children: heights.map((h) {
                        return Container(
                          margin: const EdgeInsets.symmetric(horizontal: 3),
                          width: 4,
                          height: h.clamp(6.0, 36.0),
                          decoration: BoxDecoration(
                            color: const Color(0xFF16A34A).withOpacity(0.85),
                            borderRadius: BorderRadius.circular(4),
                          ),
                        );
                      }).toList(),
                    );
                  },
                ),
              );
            }

