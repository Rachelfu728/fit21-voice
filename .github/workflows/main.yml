name: Build Fit21 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 初始化 Android 專案基礎架構
        run: |
          rm -rf android lib test
          flutter create --platforms=android --org com.example --project-name voice_reminder_assistant .
          rm -rf lib test

      - name: 解壓 Fit21 應用程式源碼
        run: |
          python3 -c "import os, zipfile; z=zipfile.ZipFile('fit21-voice-app.zip'); [open(p, 'wb').write(z.read(m)) for m in z.infolist() for p in [m.filename.replace(chr(92), '/')] if not p.endswith('/') and not p.startswith('android/') and (os.makedirs(os.path.dirname(p), exist_ok=True) if os.path.dirname(p) else True)]"
          python3 -c "import os, re; p='lib/services/speech_service.dart'; open(p, 'w').write(re.sub(r'await _tts\.setIosAudioCategory[\s\S]*?\);', '', open(p).read())) if os.path.exists(p) else None"

      - name: 配置 Android 權限與建置參數
        run: |
          echo "flutter.minSdkVersion=26" >> android/local.properties || true
          python3 -c "import os; p='android/app/build.gradle' if os.path.exists('android/app/build.gradle') else ('android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else ''); s=open(p).read() if p else ''; (open(p,'w').write(s.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 26').replace('minSdk = flutter.minSdkVersion', 'minSdk = 26').replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true' if 'kts' not in p else 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true') + ('\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n' if 'kts' not in p else '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n'))) if p else None" || true
          python3 -c "p='android/app/src/main/AndroidManifest.xml'; s=open(p).read(); perms='<uses-permission android:name=\"android.permission.INTERNET\"/>\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>\n<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n<uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>\n<uses-permission android:name=\"android.permission.USE_EXACT_ALARM\"/>\n<uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>\n<uses-permission android:name=\"android.permission.VIBRATE\"/>\n<uses-permission android:name=\"android.permission.WAKE_LOCK\"/>'; open(p,'w').write(s.replace('<application', perms+'\n<application')) if 'RECORD_AUDIO' not in s else None" || true
          sed -i 's/android:label="[^"]*"/android:label="Fit21"/g' android/app/src/main/AndroidManifest.xml || true
          for d in android/app/src/main/res/mipmap-*; do cp assets/images/app_logo.png "$d/ic_launcher.png" 2>/dev/null || true; done

      - name: 下載依賴並打包 APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 產出可下載的 APK 安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: Fit21-語音助理-安裝檔
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 自動發布到 Releases 下載頁面
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Fit21 語音提醒助理 v1.0.0"
          body: "Fit21 AI 語音提醒助理 Android 安裝檔。點擊下方 app-release.apk 即可下載並安裝到手機！"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
