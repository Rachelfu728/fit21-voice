name: Build Fit21 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Java 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Flutter 環境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 初始化 Android 專案基礎架構
        run: |
          rm -rf android lib test
          flutter create --platforms=android --org com.example --project-name voice_reminder_assistant .
          rm -rf lib test

      - name: 解壓 Fit21 應用程式源碼並修復相容性
        run: |
          python3 -c "import os, zipfile; z=zipfile.ZipFile('fit21-voice-app.zip'); [(os.makedirs(os.path.dirname(p), exist_ok=True) if os.path.dirname(p) else None, open(p, 'wb').write(z.read(m)), print('Extracted:', p)) for m in z.infolist() for p in [m.filename.replace(chr(92), '/')] if not p.endswith('/') and not p.startswith('android/')]"
          python3 -c "p='lib/main.dart'; s=open(p).read().replace('cardTheme: CardTheme(', 'cardTheme: CardThemeData(').replace('void main() async {', 'void main() {').replace('await StorageService().init();', '').replace('await NotificationService().init();', '').replace('await SpeechService().init();', ''); s=s.replace('runApp(', 'ErrorWidget.builder=(details)=>MaterialApp(home:Scaffold(body:Center(child:Text(details.exceptionAsString()))));\n  runApp('); open(p,'w').write(s); print('Patched main.dart')"
          python3 -c "p='lib/services/storage_service.dart'; s=open(p).read().replace('prefs.getStringList', '_prefs?.getStringList').replace('prefs.getString', '_prefs?.getString').replace('prefs.getBool', '_prefs?.getBool').replace('prefs.getDouble', '_prefs?.getDouble'); open(p,'w').write(s); print('Patched storage_service.dart')"
          python3 -c "import re; p='lib/screens/home_screen.dart'; s=open(p).read(); s=s.replace(\"import '../services/storage_service.dart';\", \"import '../services/speech_service.dart';\nimport '../services/storage_service.dart';\"); s=s.replace('void initState() {\n    super.initState();\n    _loadData();\n  }', 'void initState() {\n    super.initState();\n    _loadData();\n    Future.microtask(() async { try { await _storage.init(); if (mounted) _loadData(); } catch(_) {} try { await _notifications.init(); } catch(_) {} try { await SpeechService().init(); } catch(_) {} });\n  }'); s=re.sub(r'final dateStr = DateFormat\(.+?\)\.format\(now\);', 'const w=[\"\",\"星期一\",\"星期二\",\"星期三\",\"星期四\",\"星期五\",\"星期六\",\"星期日\"]; final dateStr=now.month.toString()+\"月\"+now.day.toString()+\"日 \"+w[now.weekday];', s); open(p,'w').write(s); print('Patched home_screen.dart')"
          python3 -c "import re; p='lib/models/reminder_item.dart'; s=open(p).read(); s=re.sub(r'String get formattedDate\s*\{[\s\S]*?\}', 'String get formattedDate{if(isToday)return\"今天\";if(isTomorrow)return\"明天\";const w=[\"\",\"一\",\"二\",\"三\",\"四\",\"五\",\"六\",\"日\"];return reminderTime.month.toString()+\"月\"+reminderTime.day.toString()+\"日 (\"+w[reminderTime.weekday]+\")\";}', s); s=re.sub(r'String get formattedTime\s*\{[\s\S]*?\}', 'String get formattedTime{final p=reminderTime.hour<12?\"上午\":\"下午\";final h=reminderTime.hour==0?12:(reminderTime.hour>12?reminderTime.hour-12:reminderTime.hour);final m=reminderTime.minute.toString().padLeft(2,\"0\");return p+\" \"+h.toString()+\":\"+m;}', s); open(p,'w').write(s); print('Patched reminder_item.dart')"
          python3 -c "p='lib/services/notification_service.dart'; s=open(p).read().replace('await androidImpl.requestExactAlarmsPermission();', ''); open(p,'w').write(s); print('Patched notification_service.dart')"

      - name: 注入極速語音解析與防抖動修復模組
        run: |
          cat << 'EOF' > lib/services/speech_service.dart
          import 'package:flutter/foundation.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;
          import 'storage_service.dart';

          class SpeechService {
            static final SpeechService _instance = SpeechService._internal();
            factory SpeechService() => _instance;
            SpeechService._internal();

            final stt.SpeechToText _speech = stt.SpeechToText();
            final FlutterTts _tts = FlutterTts();

            bool _isSpeechInitialized = false;
            bool _isListening = false;
            double _soundLevel = 0.0;

            bool get isListening => _isListening;
            double get soundLevel => _soundLevel;

            Future<bool> init() async {
              final micStatus = await Permission.microphone.request();
              if (!micStatus.isGranted) {
                print('麥克風權限未被授權');
              }

              try {
                _isSpeechInitialized = await _speech.initialize(
                  onError: (val) => print('語音辨識錯誤: $val'),
                  onStatus: (val) {
                    print('語音辨識狀態: $val');
                    if (val == 'done' || val == 'notListening') {
                      _isListening = false;
                    }
                  },
                );
              } catch (e) {
                print('SpeechToText 初始化異常: $e');
              }

              try {
                await _tts.setLanguage('zh-TW');
                await _tts.setSpeechRate(StorageService().getTtsRate());
                await _tts.setVolume(1.0);
                await _tts.setPitch(1.0);
              } catch (e) {
                print('FlutterTts 初始化異常: $e');
              }

              return _isSpeechInitialized;
            }

            Future<void> startListening({
              required Function(String text, bool isFinal) onResult,
              Function(double level)? onSoundLevel,
            }) async {
              if (!_isSpeechInitialized) {
                final ok = await init();
                if (!ok) return;
              }

              if (_speech.isListening) {
                try {
                  await _speech.stop().timeout(const Duration(milliseconds: 300));
                } catch (_) {}
              }

              _isListening = true;
              final locale = StorageService().getSpeechLocale();

              await _speech.listen(
                localeId: locale,
                listenFor: const Duration(seconds: 30),
                pauseFor: const Duration(milliseconds: 1500),
                onResult: (result) {
                  onResult(result.recognizedWords, result.finalResult);
                },
                onSoundLevelChange: (level) {
                  _soundLevel = level;
                  if (onSoundLevel != null) {
                    onSoundLevel(level);
                  }
                },
              );
            }

            Future<void> stopListening() async {
              _isListening = false;
              try {
                await _speech.stop().timeout(const Duration(milliseconds: 500));
              } catch (_) {}
            }

            Future<void> cancelListening() async {
              _isListening = false;
              try {
                await _speech.cancel().timeout(const Duration(milliseconds: 500));
              } catch (_) {}
            }

            Future<void> speak(String text) async {
              if (!StorageService().isTtsEnabled()) return;
              if (text.trim().isEmpty) return;

              try {
                await _tts.stop();
                await _tts.setSpeechRate(StorageService().getTtsRate());
                await _tts.speak(text);
              } catch (e) {
                print('TTS 朗讀錯誤: $e');
              }
            }

            Future<void> stopSpeaking() async {
              try {
                await _tts.stop();
              } catch (e) {
                print('TTS 停止錯誤: $e');
              }
            }
          }
          EOF

          cat << 'EOF' > lib/services/ai_service.dart
          import 'dart:convert';
          import 'package:http/http.dart' as http;
          import 'package:intl/intl.dart';
          import 'storage_service.dart';

          class AIParseResult {
            final bool success;
            final String title;
            final DateTime targetTime;
            final String category;
            final String replyMessage;
            final String? error;

            AIParseResult({
              required this.success,
              required this.title,
              required this.targetTime,
              required this.category,
              required this.replyMessage,
              this.error,
            });
          }

          class AIService {
            static final AIService _instance = AIService._internal();
            factory AIService() => _instance;
            AIService._internal();

            AIParseResult parseWithFastRules(String text) {
              return _parseWithLocalRules(text.trim());
            }

            Future<AIParseResult> parseVoiceInput(String text) async {
              final cleanInput = text.trim();
              if (cleanInput.isEmpty) {
                return AIParseResult(
                  success: false,
                  title: '',
                  targetTime: DateTime.now(),
                  category: 'other',
                  replyMessage: '我沒有聽清楚，請再說一次好嗎？',
                  error: '輸入為空',
                );
              }

              final apiKey = StorageService().getApiKey().trim();
              if (apiKey.isNotEmpty && apiKey.length >= 10) {
                try {
                  final geminiResult = await _callGeminiApi(cleanInput, apiKey);
                  if (geminiResult != null) {
                    return geminiResult;
                  }
                } catch (e) {
                  print('Gemini API 請求失敗，轉用本地規則解析: $e');
                }
              }

              return _parseWithLocalRules(cleanInput);
            }

            Future<AIParseResult?> _callGeminiApi(String text, String apiKey) async {
              final now = DateTime.now();
              final nowStr = "${now.year}-${now.month.toString().padLeft(2, "0")}-${now.day.toString().padLeft(2, "0")} ${now.hour.toString().padLeft(2, "0")}:${now.minute.toString().padLeft(2, "0")}";

              final url = Uri.parse(
                'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey',
              );

              final systemInstruction = '''
          你是一個專注於個人代辦與定時提醒的手機語音助理。
          現在的時間是：$nowStr (ISO: ${now.toIso8601String()})。
          請分析使用者的口說文字，並嚴格只輸出 JSON 格式：
          {"title": "事項內容", "targetTime": "2026-10-04T15:30:00", "category": "life", "replyMessage": "好的，已為您設定提醒。"}
          ''';

              final body = jsonEncode({
                "contents": [
                  {
                    "role": "user",
                    "parts": [{"text": "使用者口說內容: \"$text\""}]
                  }
                ],
                "systemInstruction": {
                  "parts": [{"text": systemInstruction}]
                },
                "generationConfig": {
                  "temperature": 0.2,
                  "responseMimeType": "application/json"
                }
              });

              final response = await http.post(
                url,
                headers: {'Content-Type': 'application/json'},
                body: body,
              ).timeout(const Duration(milliseconds: 2500));

              if (response.statusCode == 200) {
                final data = jsonDecode(response.body);
                final rawText = data['candidates']?[0]?['content']?['parts']?[0]?['text'] as String?;
                if (rawText != null) {
                  final parsed = jsonDecode(rawText.trim());
                  final title = (parsed['title'] as String?)?.trim() ?? text;
                  final targetTimeStr = parsed['targetTime'] as String?;
                  final category = parsed['category'] as String? ?? 'other';
                  final replyMessage = parsed['replyMessage'] as String? ?? '好的，已經為您設定提醒。';

                  DateTime targetTime = now.add(const Duration(hours: 1));
                  if (targetTimeStr != null) {
                    try {
                      targetTime = DateTime.parse(targetTimeStr);
                    } catch (_) {}
                  }

                  return AIParseResult(
                    success: true,
                    title: title,
                    targetTime: targetTime,
                    category: category,
                    replyMessage: replyMessage,
                  );
                }
              }
              return null;
            }

            String _normalizeChineseTime(String input) {
              var t = input;
              final repMap = {
                '十二': '12', '十一': '11', '十': '10',
                '一': '1', '二': '2', '兩': '2', '三': '3', '四': '4',
                '五': '5', '六': '6', '七': '7', '八': '8', '九': '9',
              };
              repMap.forEach((cn, num) {
                t = t.replaceAllMapped(RegExp('([上下中早晚午點時分個])' + cn), (m) => m.group(1)! + num);
                t = t.replaceAllMapped(RegExp(cn + '([點時分])'), (m) => num + m.group(1)!);
              });
              return t;
            }

            AIParseResult _parseWithLocalRules(String rawText) {
              final now = DateTime.now();
              DateTime targetTime = now;
              bool timeDetected = false;

              final text = _normalizeChineseTime(rawText);

              final minMatch = RegExp(r'(\d+)\s*(?:個)?分鐘後').firstMatch(text);
              if (minMatch != null) {
                final mins = int.tryParse(minMatch.group(1)!) ?? 10;
                targetTime = now.add(Duration(minutes: mins));
                timeDetected = true;
              } else if (text.contains('半小時後') || rawText.contains('半小時後')) {
                targetTime = now.add(const Duration(minutes: 30));
                timeDetected = true;
              }

              final hourMatch = RegExp(r'(\d+)\s*(?:個)?小時後').firstMatch(text);
              if (!timeDetected && hourMatch != null) {
                final hours = int.tryParse(hourMatch.group(1)!) ?? 1;
                targetTime = now.add(Duration(hours: hours));
                timeDetected = true;
              }

              int dayOffset = 0;
              if (text.contains('大後天')) {
                dayOffset = 3;
              } else if (text.contains('後天')) {
                dayOffset = 2;
              } else if (text.contains('明天') || text.contains('明早')) {
                dayOffset = 1;
              } else if (text.contains('今天')) {
                dayOffset = 0;
              }

              final timeRegex = RegExp(r'(早上|上午|中午|下午|晚上)?\s*(\d{1,2})\s*(?:點|:|時)\s*(?:(\d{1,2})|半)?');
              final match = timeRegex.firstMatch(text);

              if (!timeDetected && (dayOffset > 0 || match != null)) {
                int hour = 9;
                int minute = 0;

                if (match != null) {
                  final period = match.group(1);
                  var parsedHour = int.tryParse(match.group(2)!) ?? 9;
                  final minGroup = match.group(3);

                  if (text.contains('${match.group(2)}點半') || text.contains('${match.group(2)}:30')) {
                    minute = 30;
                  } else if (minGroup != null) {
                    minute = int.tryParse(minGroup) ?? 0;
                  }

                  if (period == '下午' || period == '晚上') {
                    if (parsedHour < 12) parsedHour += 12;
                  } else if (period == '中午' && parsedHour < 11) {
                    parsedHour += 12;
                  }

                  hour = parsedHour;
                }

                var date = now.add(Duration(days: dayOffset));
                targetTime = DateTime(date.year, date.month, date.day, hour, minute);

                if (dayOffset == 0 && targetTime.isBefore(now)) {
                  targetTime = targetTime.add(const Duration(days: 1));
                }
                timeDetected = true;
              }

              if (!timeDetected) {
                targetTime = now.add(const Duration(hours: 1));
              }

              String cleanTitle = rawText
                  .replaceAll(RegExp(r'^(提醒我|幫我記一下|記得要|記得|要|我想記|請提醒我)\s*'), '')
                  .replaceAll(RegExp(r'(今天|明天|後天|大後天)'), '')
                  .replaceAll(RegExp(r'(早上|上午|中午|下午|晚上)\s*(\d{1,2}|[一二兩三四五六七八九十]+)\s*(?:點|:|時)(?:\d{1,2}|半)?(?:分)?'), '')
                  .replaceAll(RegExp(r'(\d+|[一二兩三四五六七八九十]+)\s*(?:個)?(?:分鐘|小時)後'), '')
                  .replaceAll(RegExp(r'半小時後'), '')
                  .replaceAll(RegExp(r'(的事情|的代辦|提醒|記得)'), '')
                  .trim();

              if (cleanTitle.isEmpty) {
                cleanTitle = rawText;
              }

              String category = 'other';
              if (cleanTitle.contains('會') || cleanTitle.contains('工作') || cleanTitle.contains('報告') || cleanTitle.contains('專案')) {
                category = 'work';
              } else if (cleanTitle.contains('買') || cleanTitle.contains('繳費') || cleanTitle.contains('拿') || cleanTitle.contains('回家') || cleanTitle.contains('菜') || cleanTitle.contains('飯')) {
                category = 'life';
              } else if (cleanTitle.contains('吃藥') || cleanTitle.contains('看醫生') || cleanTitle.contains('診所') || cleanTitle.contains('運動') || cleanTitle.contains('血壓') || cleanTitle.contains('維他命')) {
                category = 'health';
              } else if (cleanTitle.contains('緊急') || cleanTitle.contains('立刻') || cleanTitle.contains('重要')) {
                category = 'urgent';
              }

              final p = targetTime.hour < 12 ? "上午" : "下午";
              final h = targetTime.hour == 0 ? 12 : (targetTime.hour > 12 ? targetTime.hour - 12 : targetTime.hour);
              final m = targetTime.minute.toString().padLeft(2, "0");
              final timeDesc = "${targetTime.month}月${targetTime.day}日 $p $h:$m";
              final replyMessage = '好的！已為您設定 $timeDesc 提醒：$cleanTitle。';

              return AIParseResult(
                success: true,
                title: cleanTitle,
                targetTime: targetTime,
                category: category,
                replyMessage: replyMessage,
              );
            }
          }
          EOF

          cat << 'EOF' > lib/widgets/voice_assistant_sheet.dart
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:uuid/uuid.dart';
          import '../models/reminder_item.dart';
          import '../services/ai_service.dart';
          import '../services/notification_service.dart';
          import '../services/speech_service.dart';
          import '../services/storage_service.dart';
          import 'category_chip.dart';

          enum VoiceState { listening, analyzing, parsed, error }

          class VoiceAssistantSheet extends StatefulWidget {
            final VoidCallback onReminderCreated;

            const VoiceAssistantSheet({
              super.key,
              required this.onReminderCreated,
            });

            @override
            State<VoiceAssistantSheet> createState() => _VoiceAssistantSheetState();
          }

          class _VoiceAssistantSheetState extends State<VoiceAssistantSheet>
              with SingleTickerProviderStateMixin {
            final SpeechService _speechService = SpeechService();
            final AIService _aiService = AIService();
            final StorageService _storageService = StorageService();
            final NotificationService _notificationService = NotificationService();

            VoiceState _state = VoiceState.listening;
            String _spokenText = '';
            AIParseResult? _parseResult;
            String _errorMessage = '';
            bool _isAnalyzing = false;

            late AnimationController _animController;

            @override
            void initState() {
              super.initState();
              _animController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1400),
              )..repeat(reverse: true);

              _startListening();
            }

            @override
            void dispose() {
              _animController.dispose();
              _speechService.stopListening().catchError((_) {});
              _speechService.stopSpeaking().catchError((_) {});
              super.dispose();
            }

            Future<void> _startListening() async {
              _isAnalyzing = false;
              setState(() {
                _state = VoiceState.listening;
                _spokenText = '';
                _errorMessage = '';
                _parseResult = null;
              });

              final ready = await _speechService.init();
              if (!ready) {
                if (mounted) {
                  setState(() {
                    _state = VoiceState.error;
                    _errorMessage = '無法啟用麥克風或語音辨識，請至手機設定允許麥克風權限。';
                  });
                }
                return;
              }

              await _speechService.startListening(
                onResult: (text, isFinal) {
                  if (mounted) {
                    setState(() {
                      _spokenText = text;
                    });
                    if (isFinal && text.trim().isNotEmpty) {
                      _analyzeText(text);
                    }
                  }
                },
                onSoundLevel: null,
              );
            }

            Future<void> _analyzeText(String text) async {
              if (_isAnalyzing || _state == VoiceState.parsed) return;
              final clean = text.trim();
              if (clean.isEmpty) {
                setState(() {
                  _state = VoiceState.error;
                  _errorMessage = '沒有偵測到說話內容，請對著麥克風再試一次。';
                });
                return;
              }

              _isAnalyzing = true;
              _speechService.stopListening().catchError((_) {});

              final localResult = _aiService.parseWithFastRules(clean);
              final apiKey = StorageService().getApiKey().trim();

              if (apiKey.isEmpty || apiKey.length < 10) {
                if (mounted) {
                  setState(() {
                    _state = VoiceState.parsed;
                    _parseResult = localResult;
                  });
                  _speechService.speak(localResult.replyMessage).catchError((_) {});
                }
                _isAnalyzing = false;
                return;
              }

              setState(() {
                _state = VoiceState.analyzing;
              });

              AIParseResult finalResult;
              try {
                finalResult = await _aiService.parseVoiceInput(clean).timeout(
                  const Duration(milliseconds: 2500),
                  onTimeout: () => localResult,
                );
              } catch (_) {
                finalResult = localResult;
              }

              if (!mounted) return;

              if (finalResult.success) {
                setState(() {
                  _state = VoiceState.parsed;
                  _parseResult = finalResult;
                });
                _speechService.speak(finalResult.replyMessage).catchError((_) {});
              } else {
                setState(() {
                  _state = VoiceState.error;
                  _errorMessage = finalResult.replyMessage;
                });
              }
              _isAnalyzing = false;
            }

            Future<void> _confirmAndSave() async {
              if (_parseResult == null) return;

              final item = ReminderItem(
                id: const Uuid().v4(),
                title: _parseResult!.title,
                reminderTime: _parseResult!.targetTime,
                category: _parseResult!.category,
                rawVoiceInput: _spokenText,
              );

              await _storageService.saveReminder(item);
              await _notificationService.scheduleReminder(item);

              widget.onReminderCreated();

              if (mounted) {
                Navigator.pop(context);
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Row(
                      children: [
                        const Icon(Icons.check_circle_rounded, color: Colors.white),
                        const SizedBox(width: 8),
                        Expanded(child: Text('已設定提醒：${item.title}')),
                      ],
                    ),
                    backgroundColor: const Color(0xFF16A34A),
                    behavior: SnackBarBehavior.floating,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                  ),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              final theme = Theme.of(context);

              return Container(
                constraints: BoxConstraints(
                  minHeight: 460,
                  maxHeight: MediaQuery.of(context).size.height * 0.88,
                ),
                padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 20),
                decoration: BoxDecoration(
                  color: theme.scaffoldBackgroundColor,
                  borderRadius: const BorderRadius.vertical(top: Radius.circular(32)),
                  boxShadow: [
                    BoxShadow(
                      color: Colors.black.withOpacity(0.15),
                      blurRadius: 25,
                      offset: const Offset(0, -5),
                    ),
                  ],
                ),
                child: SafeArea(
                  top: false,
                  child: SingleChildScrollView(
                    physics: const BouncingScrollPhysics(),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Container(
                          width: 44,
                          height: 5,
                          decoration: BoxDecoration(
                            color: Colors.grey.withOpacity(0.3),
                            borderRadius: BorderRadius.circular(3),
                          ),
                        ),
                        const SizedBox(height: 16),

                        if (_state == VoiceState.listening) _buildListeningView(theme),
                        if (_state == VoiceState.analyzing) _buildAnalyzingView(theme),
                        if (_state == VoiceState.parsed) _buildParsedView(theme),
                        if (_state == VoiceState.error) _buildErrorView(theme),

                        const SizedBox(height: 12),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _buildListeningView(ThemeData theme) {
              return Column(
                children: [
